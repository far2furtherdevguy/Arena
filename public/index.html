 const ps=spawnFor(0,P);P.pos.set(ps.x,0,ps.z);bots.forEach(b=>respawnBot(b));$('feed').innerHTML='';warm=5;score();enter();started=true;setTimeout(()=>toast('GET READY','#ffc933'),50)}

// ---- online
function leaveNet(){if(ws){try{ws.close()}catch(e){}ws=null}mp=null;mpK={};$('cancel').hidden=true}
function connect(mode){leaveNet();let u=$('srv').value.trim()||location.origin;if(!/^(wss?|https?):/.test(u))u='wss://'+u;if(!/^(https?|wss?):\/\/[^/]+/.test(u)||location.protocol==='file:'&&!$('srv').value.trim()){setStatus('Enter your server URL first (see README).');return}
 u=u.replace(/^http/,'ws');setStatus('Connecting...');$('cancel').hidden=false;let w;try{w=new WebSocket(u)}catch(e){setStatus('Bad server URL');return}ws=w;
 w.onopen=()=>w.send(JSON.stringify({t:'q',mode,name:$('nm').value.trim()||'Player',code:$('code').value.trim()}));

$('onduel').onclick=()=>connect('duel');$('onbr').onclick=()=>connect('br');$('cancel').onclick=()=>{leaveNet();setStatus('')};
function onMsg(m,mode){
 if(m.t==='wait')setStatus(`Waiting for players ${m.n}/${m.cap}${m.in?' - starting in '+m.in+'s':''}`);
 else if(m.t==='go'){cur=m.mode==='br'?'mpbr':'mpduel';goal=m.goal;over=false;kills=Array(10).fill(0);mpK={};clearBots();$('ally').style.display='none';resetP();zoneOn=m.mode==='br';zt=0;zoneM.visible=zoneOn;
  mp={id:m.you};m.players.forEach((p,i)=>{mpK[p.id]=0;if(p.id!==m.you){const b=mkBot(1+i%3,p.name);b.remote=true;b.id=p.id;b.pos.set(p.x,0,p.z);b.tx=p.x;b.tz=p.z;b.ty=0;b.tr=0;b.pp=null;bots.push(b)}else P.pos.set(p.x,0,p.z)});
  warm=0;setStatus('');if(!touch)setTimeout(()=>toast('Click to capture mouse','#ffc933'),600);$('cancel').hidden=true;$('feed').innerHTML='';score();enter();started=true;toast('FIGHT','#ffc933')}
 else if(!mp)return;
 else if(m.t==='s'){const b=bots.find(x=>x.id===m.id);if(b){b.tx=m.x;b.ty=m.y;b.tz=m.z;b.tr=m.w+Math.PI}}
 else if(m.t==='f'){const b=bots.find(x=>x.id===m.id);if(b&&b.dead<=0){const a=new THREE.Vector3(b.pos.x,b.pos.y+1.3,b.pos.z),e=a.clone().add(new THREE.Vector3(Math.sin(b.tr),0,Math.cos(b.tr)).multiplyScalar(30));tracer(a,e,CH[ti(b.team)]);if(d2(b.pos,P.pos)<40)sfx(260,.1,.03,'sawtooth')}}
 else if(m.t==='hp'){if(m.hp<P.hp){dmgA=1;sfx(120,.2,.1,'sine');const b=bots.find(x=>x.id===m.from);if(b){const br=Math.atan2(-(b.pos.x-P.pos.x),-(b.pos.z-P.pos.z));$('di').style.transform=`rotate(${-(br-P.yaw)}rad)`;$('di').style.opacity=1;clearTimeout(hurt.h);hurt.h=setTimeout(()=>$('di').style.opacity=0,600)}}P.hp=m.hp}
 else if(m.t==='oh'){const b=bots.find(x=>x.id===m.id);if(b){b.hp=m.hp;b.flash=.08;b.dk.emissive.setHex(0x883322)}}
 else if(m.t==='k'){const kn=m.k===mp.id?'You':(bots.find(x=>x.id===m.k)||{}).name||'?',vn=m.v===mp.id?'You':(bots.find(x=>x.id===m.v)||{}).name||'?';feed(m.k<0?`${vn} was lost to the storm`:`${kn} > ${vn}${m.hd?' (head)':''}`,'#ff4d6d');
  if(m.v===mp.id){P.dead=999;P.hp=0;toast('You were eliminated','#ff4d6d')}else{const b=bots.find(x=>x.id===m.v);if(b){b.dead=999;b.g.visible=false;b.bar.visible=false}if(m.k===mp.id)toast(m.hd?'HEADSHOT':'ELIMINATED '+vn.toUpperCase(),'#35c8ff')}}
 else if(m.t==='rs'){P.pos.set(m.x,0,m.z);P.dead=0;P.hp=100;P.ammo=WEAP[wi].mag;P.rel=0;P.gl=3;P.hl=2;P.prot=3}
 else if(m.t==='ro'){const b=bots.find(x=>x.id===m.id);if(b){b.dead=0;b.hp=100;b.g.visible=true;b.pos.set(m.x,0,m.z);b.tx=m.x;b.tz=m.z}}
 else if(m.t==='sc'){m.s.forEach(([id,k])=>mpK[id]=k);score()}
 else if(m.t==='g')boxW(m.x,m.z,m.w,m.d);
 else if(m.t==='l'){const i=bots.findIndex(x=>x.id===m.id);if(i>=0){scene.remove(bots[i].g);scene.remove(bots[i].bar);bots.splice(i,1)}}
 else if(m.t==='end'){const win=m.w===mp.id;endGame(win);leaveNetLater()}}
function leaveNetLater(){setTimeout(()=>{const w=ws;ws=null;mp=null;try{w&&w.close()}catch(e){}},500)}
// ---- input
function jump(){if(playing&&P.ground&&P.dead<=0){P.vy=7.2;P.ground=false;P.slide=null;P.slcd=1}}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')jump();if(e.code==='KeyR')reload();if(e.code==='KeyQ')gloo();if(e.code==='KeyF')heal()});addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousedown',()=>{if(playing){mouseDown=true;if(!touch&&!document.pointerLockElement)ren.domElement.requestPointerLock()}});addEventListener('mouseup',()=>mouseDown=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement){P.yaw-=e.movementX*.0022*sens;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-e.movementY*.0022*sens))}});
const stick=$('stick'),sk=stick.firstElementChild;
document.addEventListener('touchstart',e=>{if(!playing)return;for(const t of e.changedTouches){const el=t.target;if(el.closest('button,.ab'))continue;e.preventDefault();

 else if(t.clientX<innerWidth*.45&&t.clientY>innerHeight*.3){T[t.identifier]={k:'m',x:t.clientX,y:t.clientY};stick.style.left=t.clientX-55+'px';stick.style.bottom=innerHeight-t.clientY-55+'px'}
 else T[t.identifier]={k:'l',x:t.clientX,y:t.clientY}}},{passive:false});
document.addEventListener('touchmove',e=>{if(!playing)return;e.preventDefault();for(const t of e.changedTouches){const s=T[t.identifier];if(!s)continue;
 if(s.k==='m'){mv.x=Math.max(-1,Math.min(1,(t.clientX-s.x)/50));mv.y=Math.max(-1,Math.min(1,(t.clientY-s.y)/50));sk.style.transform=`translate(${mv.x*35}px,${mv.y*35}px)`}
 else{P.yaw-=(t.clientX-s.x)*.006*sens;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-(t.clientY-s.y)*.006*sens));s.x=t.clientX;s.y=t.clientY}}},{passive:false});
const tend=e=>{for(const t of e.changedTouches){const s=T[t.identifier];if(s&&s.k==='m'){mv.x=mv.y=0;sk.style.transform='';stick.style.left='30px';stick.style.bottom=''}delete T[t.identifier]}};
document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);
[['jump',jump],['reload',reload],['gloo',()=>gloo()],['heal',heal]].forEach(([id,f])=>$(id).addEventListener('touchstart',e=>{e.preventDefault();f()}));
// ---- aim assist
function assist(dt,firing){let best=null,be=1,locked=false;if(!aimOn||P.dead>0)return false;
 for(const b of bots){if(b.dead>0||!(b.remote||b.team!==0))continue;const dx=b.pos.x-P.pos.x,dy=b.pos.y+1.35-(P.pos.y+1.7),dz=b.pos.z-P.pos.z,dist=Math.hypot(dx,dz);if(dist>60)continue;
  const ty=Math.atan2(-dx,-dz),tp=Math.atan2(dy,dist);let ey=ty-P.yaw;ey=Math.atan2(Math.sin(ey),Math.cos(ey));const ep=tp-P.pitch,e=Math.hypot(ey,ep),cone=.07+.5/dist;
  if(e<cone&&e<be&&los3(P.pos.x,P.pos.y+1.7,P.pos.z,b.pos.x,b.pos.y+1.35,b.pos.z)){be=e;best={ey,ep}}}
 if(best){locked=true;const k=Math.min(1,dt*9)*(firing?.75:.15);P.yaw+=best.ey*k;P.pitch+=best.ep*k}return locked}

const mm=$('mm').getContext('2d'),MS=120/(HW*2);
function drawMM(){const c=mm;c.clearRect(0,0,120,120);c.save();c.beginPath();c.arc(60,60,60,0,7);c.clip();c.fillStyle='#0b3b66dd';c.fillRect(0,0,120,120);c.fillStyle='#8fb8dd';
 for(const o of AB)if(o.y0===0&&o.t>1)c.fillRect(60+o.x0*MS,60+o.z0*MS,(o.x1-o.x0)*MS,(o.z1-o.z0)*MS);
 c.strokeStyle='#ffc933';c.lineWidth=2;for(const s of SL){c.beginPath();c.moveTo(60+s.ax*MS,60+s.az*MS);c.lineTo(60+s.bx*MS,60+s.bz*MS);c.stroke()}
 if(zoneOn){c.strokeStyle='#4fb0ff';c.lineWidth=2;c.beginPath();c.arc(60,60,zr*MS,0,7);c.stroke()}
 for(const b of bots)if(b.dead<=0&&(b.team===0&&!b.remote||d2(b.pos,P.pos)<26)){c.fillStyle=CS[ti(b.team)];c.beginPath();c.arc(60+b.pos.x*MS,60+b.pos.z*MS,3.5,0,7);c.fill()}
 c.translate(60+P.pos.x*MS,60+P.pos.z*MS);c.rotate(-P.yaw);c.fillStyle='#fff';c.beginPath();c.moveTo(0,-7);c.lineTo(5,5);c.lineTo(-5,5);c.fill();c.restore()}
// ---- loop
let last=performance.now(),wsec=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;wheel.rotation.z+=dt*.12;gond.forEach(g=>g.rotation.z=-wheel.rotation.z);
 let firing=mouseDown||Object.values(T).some(s=>s.k==='f'),locked=false;
 if(playing&&!over){
  if(warm>0){warm-=dt;const s=Math.ceil(warm);if(s!==wsec&&warm>0){wsec=s;toast(s>3?'GET READY':String(s),'#ffc933',900)}if(warm<=0)toast('FIGHT','#ffc933')}
  if(zoneOn&&warm<=0){zt+=dt;zr=zoneR(zt);zoneM.scale.set(zr,1,zr);if(!mp&&warm<=0){if(Math.hypot(P.pos.x,P.pos.z)>zr&&P.dead<=0&&P.prot<=0){zoneHurt(dt)}for(const b of bots)if(b.dead<=0&&Math.hypot(b.pos.x,b.pos.z)>zr)dmgBot(b,4*dt,null,false)}if(Math.floor(zt*2)!==Math.floor((zt-dt)*2))score()}
  if(warm<=0)P.prot=Math.max(0,P.prot-dt);P.glcd=Math.max(0,P.glcd-dt);P.slcd=Math.max(0,P.slcd-dt);
  if(P.dead>0&&!mp){P.dead-=dt;if(P.dead<=0){const s=spawnFor(0,P);P.pos.set(s.x,0,s.z);P.hp=100;P.ammo=WEAP[wi].mag;P.rel=0;P.gl=3;P.hl=2;P.prot=3}}
  else if(P.dead<=0){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-mv.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x,l=Math.hypot(f,s)||1,k=Math.min(1,l),sp=keys.ShiftLeft||k>.95&&touch?8.6:6,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
   if(P.slide){const sl=P.slide;sl.t+=dt*16;const q=Math.min(1,sl.t/sl.s.len);P.pos.x=sl.fx+(sl.tx-sl.fx)*q;P.pos.z=sl.fz+(sl.tz-sl.fz)*q;P.spd=16;if(q>=1){P.slide=null;P.slcd=1.5}}
   else{const vx=(-sy*f+cy*s)/l*k*sp,vz=(-cy*f-sy*s)/l*k*sp;P.pos.x+=vx*dt;P.pos.z+=vz*dt;P.spd=Math.hypot(vx,vz);
    if(P.slcd<=0&&P.ground)for(const sl of SL){if(Math.hypot(P.pos.x-sl.ax,P.pos.z-sl.az)<1.3){P.slide={s:sl,t:0,fx:sl.ax,fz:sl.az,tx:sl.bx,tz:sl.bz};break}if(Math.hypot(P.pos.x-sl.bx,P.pos.z-sl.bz)<1.3){P.slide={s:sl,t:0,fx:sl.bx,fz:sl.bz,tx:sl.ax,tz:sl.az};break}}}
   resolve(P.pos,.4,P.pos.y,.7);
   const gh=groundH(P.pos.x,P.pos.z,P.pos.y);P.vy-=20*dt;P.pos.y+=P.vy*dt;if(P.pos.y<=gh){P.pos.y=gh;P.vy=0}P.ground=P.pos.y<=gh+.02;
   P.cd-=dt;if(P.rel>0){P.rel-=dt;if(P.rel<=0)P.ammo=WEAP[wi].mag}else if(firing&&P.cd<=0&&warm<=0)shoot();
   if(P.healQ>0){const h=Math.min(P.healQ,20*dt);P.hp=Math.min(100,P.hp+h);P.healQ-=h}
   locked=assist(dt,firing&&warm<=0)}
  if(!mp)for(const b of bots)botUpdate(b,dt);
  else{for(const b of bots){if(b.dead>0)continue;const ox=b.pos.x,oz=b.pos.z,k=Math.min(1,dt*12);b.pos.x+=(b.tx-b.pos.x)*k;b.pos.z+=(b.tz-b.pos.z)*k;b.pos.y+=(b.ty-b.pos.y)*k;let da=b.tr-b.rot;da=Math.atan2(Math.sin(da),Math.cos(da));b.rot+=da*k;animB(b,dt,ox,oz)}
   lastSend+=dt;if(lastSend>.05&&ws&&ws.readyState===1&&P.dead<=0){lastSend=0;ws.send(JSON.stringify({t:'u',x:+P.pos.x.toFixed(2),y:+P.pos.y.toFixed(2),z:+P.pos.z.toFixed(2),w:+P.yaw.toFixed(3),p:+P.pitch.toFixed(3)}))}}
  for(let i=tmp.length-1;i>=0;i--){tmp[i].t-=dt;if(tmp[i].t<=0){rm(tmp[i].o);tmp.splice(i,1)}}}
 $('xh').classList.toggle('lock',locked);
 const dead=P.dead>0;cam.position.set(P.pos.x,P.pos.y+(dead?.4:1.7),P.pos.z);cam.rotation.set(dead?-.4:P.pitch,P.yaw,dead?.6:0);
 gun.position.z+=(-.55-gun.position.z)*Math.min(1,dt*15);gun.rotation.x=P.rel>0?-.6:0;muzzle=Math.max(0,muzzle-dt);mf.intensity=muzzle>0?3:0;
 for(const b of bots){b.bar.visible=b.dead<=0&&d2(b.pos,P.pos)<45;if(b.bar.visible){b.bar.position.set(b.pos.x,b.pos.y+2.15,b.pos.z);b.bar.quaternion.copy(cam.quaternion);const r=Math.max(.001,b.hp/100);b.fl.scale.x=r;b.fl.position.x=-.43*(1-r)}}
 for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.t-=dt;e.m.material.opacity=Math.max(0,e.t*10);if(e.t<=0){scene.remove(e.m);e.m.geometry.dispose();e.m.material.dispose();fx.splice(i,1)}}
 dmgA=Math.max(0,dmgA-dt*2.5);$('dmg').style.opacity=dmgA;
 $('php').lastElementChild.firstChild.style.width=P.hp+'%';$('hpt').textContent=Math.ceil(P.hp)+(P.prot>0?'  SHIELD':'');
 $('ammo').innerHTML=(P.rel>0?'RELOADING':P.ammo+' / '+WEAP[wi].mag)+`<br><small>${WEAP[wi].n}</small>`;$('gloo').textContent='GLOO '+P.gl;$('heal').textContent='HEAL '+P.hl;
 const al=bots.find(b=>b.team===0&&!b.remote);if(al)$('ally').lastElementChild.firstChild.style.width=al.dead>0?'0%':al.hp+'%';
 $('xh').style.transform=`scale(${1+Math.min(1,P.spd/10)*.5+(muzzle>0?.4:0)})`;
 if(started)drawMM();
 ren.render(scene,cam)}
requestAnimationFrame(loop);
